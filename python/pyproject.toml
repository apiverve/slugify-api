[project]
name = "apiverve-slugify"
version = "1.2.3"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Slugify converts text into clean, URL-friendly slugs with custom separators and optional lowercase formatting. Pass any raw string to get back the original text and its normalized slug with accents stripped and spaces replaced."
keywords = ["slug", "slugify", "url slug", "seo slug", "url friendly"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/slugify?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/slugify?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/slugify-api"
Twitter = "https://twitter.com/apivervehq"
